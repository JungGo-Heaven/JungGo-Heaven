name: Build and Docker Push

on:
  workflow_dispatch:
  push:
    branches:
      - feat/workflow
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java and Gradle
        uses: ./.github/actions

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Generate image tags
        id: tags
        run: |
          TIMESTAMP=$(date +'%Y%m%d%H%M%S')
          echo "version=${TIMESTAMP}" >> $GITHUB_OUTPUT
          echo "latest=latest" >> $GITHUB_OUTPUT

      - name: Docker login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Docker build
        run: |
          docker build -t ${{ secrets.REPOSITORY }}/${{ secrets.IMAGE_NAME }}:${{ steps.tags.outputs.version }} .
          docker tag ${{ secrets.REPOSITORY }}/${{ secrets.IMAGE_NAME }}:${{ steps.tags.outputs.version }} ${{ secrets.REPOSITORY }}/${{ secrets.IMAGE_NAME }}:latest

      - name: Docker push
        run: |
          docker push ${{ secrets.REPOSITORY }}/${{ secrets.IMAGE_NAME }}:${{ steps.tags.outputs.version }}
          docker push ${{ secrets.REPOSITORY }}/${{ secrets.IMAGE_NAME }}:latest

      - name: Save image tag to artifact
        run: echo "${{ steps.tags.outputs.version }}" > image-tag.txt

      - name: Upload image tag
        uses: actions/upload-artifact@v3
        with:
            name: image-tag
            path: image-tag.txt
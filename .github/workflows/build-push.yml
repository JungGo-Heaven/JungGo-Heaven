name: Build and Docker Push

on:
  workflow_dispatch:
  push:
    branches:
      - feat/workflow
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java and Gradle
        uses: ./.github/actions

      - name: Create application.yml with secrets
        run: |
          mkdir -p src/main/resources
          cat <<EOF > src/main/resources/application.yml
          server:
            port: 8080
    
          spring:
            application:
              name: JungGo-heaven
    
            datasource:
              url: ${{ secrets.RDS_PORT }}
              username: ${{ secrets.RDS_HOST }}
              password: ${{ secrets.RDS_PASSWORD }}
              driver-class-name: com.mysql.cj.jdbc.Driver
    
            jpa:
              hibernate:
                ddl-auto: update
              properties:
                hibernate:
                  show_sql: true
                  format_sql: true
                  use_sql_comments: true
                  dialect: org.hibernate.dialect.MySQLDialect
                  jdbc:
                    batch_size: 100
                  order_inserts: true
                  order_updates: true
    
            data:
              redis:
                host: ${{ secrets.REDIS_HOST }}
                port: ${{ secrets.REDIS_PORT }}
    
            rabbitmq:
              host: ${{ secrets.RABBITMQ_HOST }}
              port: ${{ secrets.RABBITMQ_PORT }}
              username: ${{ secrets.RABBITMQ_USERNAME }}
              password: ${{ secrets.RABBITMQ_PASSWORD }}
              listener:
                simple:
                  concurrency: 3
                  max-concurrency: 5
    
            elasticsearch:
              uris: ${{ secrets.ELASTICSEARCH_URIS }}
    
            mail:
              host: ${{ secrets.JAVA_MAIL_HOST }}
              port: ${{ secrets.JAVA_MAIL_PORT }}
              username: ${{ secrets.JAVA_MAIL_USERNAME }}
              password: ${{ secrets.JAVA_MAIL_PASSWORD }}
    
            cloud:
              aws:
                credentials:
                  access-key: ${{ secrets.AWS_CREDENTIALS_ACCESS_KEY }}
                  secret-key: ${{ secrets.AWS_CREDENTIALS_SECRET_KEY }}
                s3:
                  bucket: ${{ secrets.AWS_CLOUD_S3_BUCKET }}
                region:
                  static: ${{ secrets.AWS_REGION }}
    
            servlet:
              multipart:
                enabled: true # 멀티파트 업로드 지원 여부
                file-size-threshold: 0B # 파일을 디스크에 저장하지 않고 메모리에 저장하는 최소 크기
                location: ${java.io.tmpdir} # 업로드된 파일이 임시로 저장되는 디스크 위치
                max-file-size: 100MB # 파일 하나 당 최대 사이즈 (default: 1MB)
                max-request-size: 100MB # 하나의 요청 당 최대 업로드 가능 사이즈 (default: 10MB)
    
            security:
              oauth2:
                client:
                  registration:
                    google:
                      client-id: ${{ secrets.OAUTH2_GOOGLE_CLIENT_ID }}
                      client-secret: ${{ secrets.OAUTH2_GOOGLE_CLIENT_SECRET }}
                      scope: profile, email
    
                    naver:
                      client-id: ${{ secrets.OAUTH2_NAVER_CLIENT_ID }}
                      client-secret: ${{ secrets.OAUTH2_NAVER_CLIENT_SECRET }}
                      redirect-uri: ${{ secrets.OAUTH2_NAVER_REDIRECT_URI }}
                      authorization-grant-type: authorization_code
                      scope:
                        - response/nickname
                        - response/email
                        - response/mobile
                      client-name: naver
    
                    kakao:
                      client-id: ${{ secrets.OAUTH2_KAKAO_CLIENT_ID }}
                      client-secret: ${{ secrets.OAUTH2_KAKAO_CLIENT_SECRET }}
                      redirect-uri: ${{ secrets.OAUTH2_KAKAO_REDIRECT_URI }}
                      client-authentication-method: POST
                      authorization-grant-type: authorization_code
                      scope:
                        - profile_nickname
                        - account_email
                        - phone_number
                      client-name: kakao
    
                  provider:
                    naver:
                      authorization_uri: https://nid.naver.com/oauth2.0/authorize
                      token_uri: https://nid.naver.com/oauth2.0/token
                      user-info-uri: https://openapi.naver.com/v1/nid/me
                      user_name_attribute: response
    
                    kakao:
                      authorization-uri: https://kauth.kakao.com/oauth/authorize
                      token-uri: https://kauth.kakao.com/oauth/token
                      user-info-uri: https://kapi.kakao.com/v2/user/me
                      user-name-attribute: id
    
          redisson:
            config:
              singleServerConfig:
                address: ${{ secrets.REDISSON_ADDRESS }}
    
          JWT:
            SECRET:
              KEY: ${{ secrets.JWT_SECRET_KEY }}
    
          toss:
            payments:
              secret-key: ${{ secrets.TOSS_PAYMENTS_SECRET_KEY }}
              client-key: ${{ secrets.TOSS_PAYMENTS_CLIENT_KEY }}
    
          api-key:
            kakao: ${{ secrets.API_KEY_KAKAO }}
    
          cloudfront:
            domain: ${{ secrets.CLOUDFRONT_DOMAIN }}
    
          bespoke:
            url: ${{ secrets.BESPOKE_URL }}
          EOF

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Generate image tags
        id: tags
        run: |
          TIMESTAMP=$(date +'%Y%m%d%H%M%S')
          echo "version=${TIMESTAMP}" >> $GITHUB_OUTPUT
          echo "latest=latest" >> $GITHUB_OUTPUT

      # ECR 접근을 위한 AWS 인증
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
        with:
          mask-password: true

      - name: Build, tag, and push image to Amazon ECR
        run: |
          REGION=${{ secrets.AWS_REGION }}
          ECR_REPOSITORY=${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG="latest"
          
          docker build -t $ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REPOSITORY:$IMAGE_TAG ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG
          docker push ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Save image URIs
        run: |
          mkdir -p .github/workflows/output
          echo "$ECR_REPOSITORY_URI:$IMAGE_TAG" > .github/workflows/output/spring-image-uri.txt

      - name: Upload image URIs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-image-uri
          path: .github/workflows/output/spring-image-uri.txt
          retention-days: 1
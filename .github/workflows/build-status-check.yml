name: Check Build Status

on:
  workflow_run:
    workflows:
      - "Build and Docker Push"
      - "Elasticsearch and Kibana to ECR"
      - "Redis and RabbitMQ to ECR"
    types:
      - completed
  workflow_dispatch:

jobs:
  check-status:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check-success.outputs.deploy }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Build and Docker Push Status
        id: check-build-push
        run: |
          WORKFLOW_NAME="Build and Docker Push"
          echo "Checking status of $WORKFLOW_NAME workflow..."
          
          # 워크플로우 목록 조회
          RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows")
          
          # 해당 이름의 워크플로우 ID 추출
          WORKFLOW_ID=$(echo "$RESPONSE" | jq -r '.workflows[] | select(.name == "'"$WORKFLOW_NAME"'") | .id')
          
          if [ -z "$WORKFLOW_ID" ]; then
            echo "Workflow '$WORKFLOW_NAME' not found"
            echo "build_push_status=NOT_FOUND" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # 가장 최근 실행 상태 조회
          RUNS_RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$WORKFLOW_ID/runs?per_page=1")
          
          BUILD_PUSH_STATUS=$(echo "$RUNS_RESPONSE" | jq -r '.workflow_runs[0].conclusion // "MISSING"')
          echo "build_push_status=$BUILD_PUSH_STATUS" >> $GITHUB_OUTPUT
          echo "$WORKFLOW_NAME status: $BUILD_PUSH_STATUS"

      - name: Check Elasticsearch and Kibana Status
        id: check-es-kibana
        run: |
          WORKFLOW_NAME="Elasticsearch and Kibana to ECR"
          echo "Checking status of $WORKFLOW_NAME workflow..."
          
          RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows")
          
          WORKFLOW_ID=$(echo "$RESPONSE" | jq -r '.workflows[] | select(.name == "'"$WORKFLOW_NAME"'") | .id')
          
          if [ -z "$WORKFLOW_ID" ]; then
            echo "Workflow '$WORKFLOW_NAME' not found"
            echo "es_kibana_status=NOT_FOUND" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          RUNS_RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$WORKFLOW_ID/runs?per_page=1")
          
          ES_KIBANA_STATUS=$(echo "$RUNS_RESPONSE" | jq -r '.workflow_runs[0].conclusion // "MISSING"')
          echo "es_kibana_status=$ES_KIBANA_STATUS" >> $GITHUB_OUTPUT
          echo "$WORKFLOW_NAME status: $ES_KIBANA_STATUS"

      - name: Check Redis and RabbitMQ Status
        id: check-redis-rabbitmq
        run: |
          WORKFLOW_NAME="Redis and RabbitMQ to ECR"
          echo "Checking status of $WORKFLOW_NAME workflow..."
          
          RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows")
          
          WORKFLOW_ID=$(echo "$RESPONSE" | jq -r '.workflows[] | select(.name == "'"$WORKFLOW_NAME"'") | .id')
          
          if [ -z "$WORKFLOW_ID" ]; then
            echo "Workflow '$WORKFLOW_NAME' not found"
            echo "redis_rabbitmq_status=NOT_FOUND" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          RUNS_RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$WORKFLOW_ID/runs?per_page=1")
          
          REDIS_RABBITMQ_STATUS=$(echo "$RUNS_RESPONSE" | jq -r '.workflow_runs[0].conclusion // "MISSING"')
          echo "redis_rabbitmq_status=$REDIS_RABBITMQ_STATUS" >> $GITHUB_OUTPUT
          echo "$WORKFLOW_NAME status: $REDIS_RABBITMQ_STATUS"

      - name: Check if all workflows succeeded
        id: check-success
        run: |
          BUILD_PUSH_STATUS="${{ steps.check-build-push.outputs.build_push_status }}"
          ES_KIBANA_STATUS="${{ steps.check-es-kibana.outputs.es_kibana_status }}"
          REDIS_RABBITMQ_STATUS="${{ steps.check-redis-rabbitmq.outputs.redis_rabbitmq_status }}"
          
          echo "Build and Push status: $BUILD_PUSH_STATUS"
          echo "ES and Kibana status: $ES_KIBANA_STATUS"
          echo "Redis and RabbitMQ status: $REDIS_RABBITMQ_STATUS"
          
          if [ "$BUILD_PUSH_STATUS" = "success" ] && [ "$ES_KIBANA_STATUS" = "success" ] && [ "$REDIS_RABBITMQ_STATUS" = "success" ]; then
            echo "All required workflows have succeeded"
            echo "deploy=true" >> $GITHUB_OUTPUT
          else
            echo "Not all required workflows have succeeded yet"
            echo "deploy=false" >> $GITHUB_OUTPUT
          fi
name: Deploy with AWS CodeDeploy

on:
  workflow_run:
    workflows:
      - "Build and Docker Push"
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    # "Build and Docker Push"가 성공했을 때 or 직접 workflow 실행했을 때 실행 .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # artifact를 업로드한 workflow 파일 이름을 지정하여 다운로드
      - name: Download image tag
        id: download-artifact
        uses: actions/download-artifact@v4
        with:
          name: image-tag
          path: ./artifacts
          run-id: ${{ github.event.workflow_run.id }}
          repository: JungGo-Heaven/JungGo-Heaven
          github-token: ${{ secrets.ACCESS_TOKEN }}
        if: ${{ github.event_name != 'workflow_dispatch' }}
        continue-on-error: true

      - name: Extract image tag
        id: extract-tag
        run: |
          if [ -f "./artifacts/image-tag.txt" ]; then
            echo "IMAGE_TAG=$(cat ./artifacts/image-tag.txt)" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
          fi
          echo "Using image tag: $IMAGE_TAG"

      - name: Create appspec.yml
        run: |
          cat > appspec.yml << EOF
          version: 0.0
          os: linux
          files:
            - source: /scripts
              destination: /home/ubuntu/app/scripts
          hooks:
            BeforeInstall:
              - location: scripts/before_install.sh
                timeout: 300
                runas: ubuntu
            AfterInstall:
              - location: scripts/after_install.sh
                timeout: 300
                runas: ubuntu
            ApplicationStart:
              - location: scripts/start_application.sh
                timeout: 300
                runas: ubuntu
          EOF

      # 현재 실행 중인 프로그램 백업
      - name: Create deployment scripts
        run: |
          mkdir -p scripts
          cat > scripts/before_install.sh << 'EOF'
          #!/bin/bash
          set -e
          echo "Before Install script started"

          BACKUP_DIR="/home/ubuntu/backup"
          ARCHIVE_DIR="/home/ubuntu/backup_archive"
          sudo mkdir -p "$BACKUP_DIR" "$ARCHIVE_DIR"

          backup_container() {
            CONTAINER_NAME="$1"
            BACKUP_FILE="$BACKUP_DIR/${CONTAINER_NAME}.tar"
            ARCHIVED_FILE="$ARCHIVE_DIR/${CONTAINER_NAME}_$(date +'%Y%m%d%H%M%S').tar"

            if docker ps -a --format "{{.Names}}" | grep -q "$CONTAINER_NAME"; then
              if [ -f "$BACKUP_FILE" ]; then
                echo "Moving previous backup of $CONTAINER_NAME to archive: $ARCHIVED_FILE"
                sudo mv "$BACKUP_FILE" "$ARCHIVED_FILE"
              fi
              echo "Backing up current $CONTAINER_NAME container..."
              docker export "$CONTAINER_NAME" > "$BACKUP_FILE"
              echo "Backup of $CONTAINER_NAME created: $BACKUP_FILE"
            fi
          }

          backup_container "jungo-heaven-app-container"
          echo "Before Install script finished"
          exit 0
          EOF

          # 애플리케이션 설정 파일 생성
          cat > scripts/after_install.sh << 'EOF'
          #!/bin/bash
          set -e
          echo "After Install script started"

          # /home/ubuntu/app 디렉토리에 ubuntu 권한 부여
          sudo chown -R ubuntu:ubuntu /home/ubuntu/app
          sudo chmod -R 755 /home/ubuntu/app

          # application.yml 파일을 secrets에서 불러와서 작성
          mkdir -p /home/ubuntu/app/config
          cat > /home/ubuntu/app/config/application.yml << 'APPYML'
          ${{ secrets.APPLICATION_YML }}
          APPYML

          chmod -R 755 /home/ubuntu/app

          echo "After Install script finished"
          exit 0
          EOF

          # 애플리케이션 실행 (docker run - 다른 EC2에서 이미지 pull)
          cat > scripts/start_application.sh << 'EOF'
          #!/bin/bash
          set -e
          echo "Start Application script started"

          # Spring Boot 애플리케이션 빌드
          echo "Building Spring Boot application..."
          cd /home/ubuntu/app
          ./gradlew build -x test # 또는 ./mvnw clean package
          echo "Spring Boot application build complete."

          # Docker 이미지 빌드
          echo "Building Docker image..."
          docker build -t junggo-heaven-app:latest -f Dockerfile .
          echo "Docker image built: junggo-heaven-app:latest"

          REMOTE_REGISTRY_ELK="10.0.142.85:5000"
          REMOTE_REGISTRY_REDIMQ="10.0.135.254:5000"

          # Elastic Search & Kibana 관련 컨테이너 이미지 pull 및 실행
          echo "Pulling elk image from $REMOTE_REGISTRY_ELK/elk:latest"
          docker pull "$REMOTE_REGISTRY_ELK/elk:latest"
          docker stop "elk-container" || true
          docker rm "elk-container" || true
          docker run -d --name "elk-container" -p 9200:9200 -p 5601:5601 "$REMOTE_REGISTRY_ELK/elk:latest"

          # Redis&MQ 관련 컨테이너 이미지 pull 및 실행
          echo "Pulling redismq image from $REMOTE_REGISTRY_REDIMQ/redismq:latest"
          docker pull "$REMOTE_REGISTRY_REDIMQ/redismq:latest"
          docker stop "redismq-container" || true
          docker rm "redismq-container" || true
          docker run -d --name "redismq-container" -p 6379:6379 -p 5672:5672 "$REMOTE_REGISTRY_REDIMQ/redismq:latest"

          # Spring Boot 애플리케이션 컨테이너 실행
          docker stop "jungo-heaven-app-container" || true
          docker rm "jungo-heaven-app-container" || true
          docker run -d --name "jungo-heaven-app-container" -p 8080:8080 \
            -e SPRING_DATASOURCE_URL="jdbc:mysql://${{ secrets.RDS_HOST }}:${{ secrets.RDS_PORT }}/${{ secrets.RDS_DB_NAME }}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&autoReconnect=true&failOverReadOnly=true&useSSL=false" \
            -e SPRING_DATASOURCE_USERNAME="${{ secrets.RDS_USERNAME }}" \
            -e SPRING_DATASOURCE_PASSWORD="${{ secrets.RDS_PASSWORD }}" \
            -e SPRING_REDIS_HOST="${{ secrets.REDIS_HOST }}" \
            -e SPRING_REDIS_PORT="${{ secrets.REDIS_PORT }}" \
            junggo-heaven-app:latest

          sleep 20

          # 컨테이너 상태 확인 (각 컨테이너에 대해 수행)
          APP_STATUS=$(docker inspect -f '{{.State.Running}}' "jungo-heaven-app-container" 2>/dev/null)
          ELK_STATUS=$(docker inspect -f '{{.State.Running}}' "elk-container" 2>/dev/null)
          REDISMQ_STATUS=$(docker inspect -f '{{.State.Running}}' "redismq-container" 2>/dev/null)

          if [ "$APP_STATUS" = "true" ] && [ "$ELK_STATUS" = "true" ] && [ "$REDISMQ_STATUS" = "true" ];
          then
            echo "All applications started successfully, connected to RDS"
            docker system prune -af --volumes
            exit 0
          else
            echo "One or more applications failed to start"
            exit 1
          fi
          echo "Start Application script finished"
          exit 0
          EOF
          chmod +x scripts/*.sh

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

        # Docker-compose 배포 번들 생성
      - name: Create deployment bundle
        run: zip -r deploy.zip scripts/ Dockerfile build/ src/ build.gradle

      # S3 업로드
      - name: Upload deployment bundle to S3
        run: aws s3 cp deploy.zip s3://${{ secrets.AWS_S3_BUCKET }}/deploy.zip

      - name: Deploy to AWS CodeDeploy
        run: |
          aws deploy create-deployment \
            --application-name ${{ secrets.AWS_CODEDEPLOY_APP_NAME }} \
            --deployment-group-name ${{ secrets.AWS_CODEDEPLOY_GROUP_NAME }} \
            --deployment-config-name CodeDeployDefault.OneAtATime \
            --s3-location bucket=${{ secrets.AWS_S3_BUCKET }},bundleType=zip,key=deploy.zip \
            --file-exists-behavior OVERWRITE
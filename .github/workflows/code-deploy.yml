name: Deploy from ECR to EC2

on:
  workflow_run:
    workflows:
      - "Check Build Status"
    types:
      - completed
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
  ELASTICSEARCH_IMAGE_NAME: elasticsearch
  KIBANA_IMAGE_NAME: kibana
  REDIS_IMAGE_NAME: redis
  RABBITMQ_IMAGE_NAME: rabbitmq
  SPRING_IMAGE_NAME: junggoheaven
  CODE_DEPLOY_APPLICATION_NAME: ${{ secrets.AWS_CODEDEPLOY_APP_NAME }}
  CODE_DEPLOY_DEPLOYMENT_GROUP_NAME: Git-Development-Group
  S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Elasticsearch & Kibana Artifact 다운로드
      - name: Get Elasticsearch and Kibana workflow run ID
        id: get-es-kibana-run-id
        run: |
          API_URL="https://api.github.com/repos/${{ github.repository }}/actions/workflows/push-es-kibana.yml/runs?status=success&per_page=1"
          RESPONSE=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "$API_URL")
          RUN_ID=$(echo "$RESPONSE" | jq -r '.workflow_runs[0].id')
          echo "PUSH_ES_KIBANA_RUN_ID=$RUN_ID" >> $GITHUB_ENV

      - name: Download Elasticsearch Kibana image URIs
        id: download-es-kibana-uris
        uses: actions/download-artifact@v4
        with:
          name: es-kibana-image-uris
          path: ./artifacts-es-kibana
          run-id: ${{ env.PUSH_ES_KIBANA_RUN_ID }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Redis & RabbitMQ Artifact 다운로드
      - name: Get Redis and RabbitMQ workflow run ID
        id: get-redis-rabbitmq-run-id
        run: |
          API_URL="https://api.github.com/repos/${{ github.repository }}/actions/workflows/push-redis-mq.yml/runs?status=success&per_page=1"
          RESPONSE=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "$API_URL")
          RUN_ID=$(echo "$RESPONSE" | jq -r '.workflow_runs[0].id')
          echo "REDIS_RABBITMQ_RUN_ID=$RUN_ID" >> $GITHUB_ENV

      - name: Download Redis RabbitMQ image URIs
        id: download-redis-rabbitmq-uris
        uses: actions/download-artifact@v4
        with:
          name: redis_mq_image_uris
          path: ./artifacts-redis-rabbitmq
          run-id: ${{ env.REDIS_RABBITMQ_RUN_ID }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Spring Application Image Artifact 다운로드
      - name: Get Build and Docker Push workflow run ID
        id: get-build-push-run-id
        run: |
          API_URL="https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-push.yml/runs?status=success&per_page=1"
          RESPONSE=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "$API_URL")
          RUN_ID=$(echo "$RESPONSE" | jq -r '.workflow_runs[0].id')
          echo "BUILD_PUSH_RUN_ID=$RUN_ID" >> $GITHUB_ENV

      - name: Download Spring image URI
        id: download-spring-uri
        uses: actions/download-artifact@v4
        with:
          name: spring-image-uri
          path: ./artifacts-spring
          run-id: ${{ env.BUILD_PUSH_RUN_ID }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Spring image URI
        id: extract-spring-uri
        run: |
          if [ -f "./artifacts-spring/spring_image_uri.txt" ]; then
            source "./artifacts-spring/spring_image_uri.txt"
            echo "SPRING_IMAGE_URI=$SPRING_IMAGE_URI" >> $GITHUB_ENV
          else
            echo "SPRING_IMAGE_URI=$ECR_REGISTRY/$SPRING_IMAGE_NAME:latest" >> $GITHUB_ENV
          fi
          echo "Spring Image URI: $SPRING_IMAGE_URI"

      # appspec.yml 생성
      - name: Create appspec.yml for EC2
        run: |
          cat > appspec.yml << EOF
          version: 0.0
          os: linux
          hooks:
            BeforeInstall:
              - location: scripts/before_install.sh
                timeout: 300
                runas: ubuntu
            AfterInstall:
              - location: scripts/after_install.sh
                timeout: 300
                runas: ubuntu
            ApplicationStart:
              - location: scripts/start_application.sh
                timeout: 600
                runas: ubuntu
          EOF

      # 배포 스크립트 생성
      - name: Create deployment scripts for EC2
        run: |
          mkdir -p scripts
          cat > scripts/before_install.sh << 'EOF'
          #!/bin/bash
          set -e
          echo "Before Install script started"
          if ! command -v jq &> /dev/null; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi
          echo "Before Install script finished"
          exit 0
          EOF

          cat > scripts/after_install.sh << 'EOF'
          #!/bin/bash
          set -e
          echo "After Install script started"
          
          # 권한 설정
          sudo chown -R ubuntu:ubuntu /home/ubuntu/app
          sudo chmod 755 /home/ubuntu/app/scripts/*.sh
          
          rm -rf /tmp/*
          echo "After Install script finished"
          exit 0
          EOF

          cat > scripts/start_application.sh << 'EOF'
          #!/bin/bash
          set -e
          echo "Start Application script started"
          if [[ "${{ env.DEPLOY_SPRING_APP }}" == "true" ]]; then
            echo "Pulling Spring application image: $SPRING_IMAGE_URI"
            docker pull "$SPRING_IMAGE_URI"
            docker stop spring-app-container || true
            docker rm spring-app-container || true
            docker run -d --name spring-app-container -p 8080:8080 "$SPRING_IMAGE_URI"
          else
            echo "Skipping Spring application deployment."
          fi
          echo "Start Application script finished"
          exit 0
          EOF

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload appspec.yml and scripts to S3
        run: |
          aws s3 cp appspec.yml s3://${{ env.S3_BUCKET }}/appspec.yml
          aws s3 cp --recursive scripts s3://${{ env.S3_BUCKET }}/scripts

      - name: Deploy to EC2 with CodeDeploy
        run: |
          aws deploy create-deployment \
            --application-name "${{ env.CODE_DEPLOY_APPLICATION_NAME }}" \
            --deployment-group-name "${{ env.CODE_DEPLOY_DEPLOYMENT_GROUP_NAME }}" \
            --deployment-config-name CodeDeployDefault.OneAtATime \
            --revision '{"revisionType":"S3","s3Location":{"bucket":"${{ env.S3_BUCKET }}","key":"appspec.yml"}}'
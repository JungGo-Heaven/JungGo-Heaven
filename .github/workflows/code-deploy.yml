name: Deploy from ECR to EC2

on:
  workflow_run:
    workflows:
      - "Check Build Status"
    types:
      - success
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
  ELASTICSEARCH_IMAGE_NAME: elasticsearch
  KIBANA_IMAGE_NAME: kibana
  REDIS_IMAGE_NAME: redis
  RABBITMQ_IMAGE_NAME: rabbitmq
  SPRING_IMAGE_NAME: junggoheaven
  CODE_DEPLOY_APPLICATION_NAME: ${{ secrets.AWS_CODEDEPLOY_APP_NAME }}
  CODE_DEPLOY_DEPLOYMENT_GROUP_NAME: Git-Development-Group
  S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 각 workflow artifact 다운로드
      # Elasticsearch & Kibana
      - name: Download Elasticsearch Kibana image URIs
        id: download-es-kibana-uris
        uses: actions/download-artifact@v4
        with:
          name: es-kibana-image-uris
          path: ./artifacts-es-kibana
          run-id: ${{ github.event.workflow_run.id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Elasticsearch Kibana image URIs
        id: extract-es-kibana-uris
        run: |
          if [ -f "./artifacts-es-kibana/es_kibana_image_uris.txt" ]; then
            source "./artifacts-es-kibana/es_kibana_image_uris.txt"
            echo "ELASTICSEARCH_IMAGE_URI=$ELASTICSEARCH_IMAGE_URI" >> $GITHUB_ENV
            echo "KIBANA_IMAGE_URI=$KIBANA_IMAGE_URI" >> $GITHUB_ENV
          else
            echo "ELASTICSEARCH_IMAGE_URI=$ECR_REGISTRY/$ELASTICSEARCH_IMAGE_NAME:latest" >> $GITHUB_ENV
            echo "KIBANA_IMAGE_URI=$ECR_REGISTRY/$KIBANA_IMAGE_NAME:latest" >> $GITHUB_ENV
          fi
          echo "Elasticsearch Image URI: $ELASTICSEARCH_IMAGE_URI"
          echo "Kibana Image URI: $Kibana_IMAGE_URI"

      # Redis & RabbitMQ
      - name: Download Redis RabbitMQ image URIs
        id: download-redis-rabbitmq-uris
        uses: actions/download-artifact@v4
        with:
          name: redis-rabbitmq-image-uris
          path: ./artifacts-redis-rabbitmq
          run-id: ${{ github.event.workflow_run.id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Redis RabbitMQ image URIs
        id: extract-redis-rabbitmq-uris
        run: |
          if [ -f "./artifacts-redis-rabbitmq/redis_rabbitmq_image_uris.txt" ]; then
            source "./artifacts-redis-rabbitmq/redis_rabbitmq_image_uris.txt"
            echo "REDIS_IMAGE_URI=$REDIS_IMAGE_URI" >> $GITHUB_ENV
            echo "RABBITMQ_IMAGE_URI=$RABBITMQ_IMAGE_URI" >> $GITHUB_ENV
          else
            echo "REDIS_IMAGE_URI=$ECR_REGISTRY/$REDIS_IMAGE_NAME:latest" >> $GITHUB_ENV
            echo "RABBITMQ_IMAGE_URI=$ECR_REGISTRY/$RABBITMQ_IMAGE_NAME:latest" >> $GITHUB_ENV
          fi
          echo "Redis Image URI: $REDIS_IMAGE_URI"
          echo "RabbitMQ Image URI: $RABBITMQ_IMAGE_URI"

      # Spring Application Image
      - name: Download Spring image URI
        id: download-spring-uri
        uses: actions/download-artifact@v4
        with:
          name: spring-image-uri
          path: ./artifacts-spring
          run-id: ${{ github.event.workflow_run.id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Spring image URI
        id: extract-spring-uri
        run: |
          if [ -f "./artifacts-spring/spring_image_uri.txt" ]; then
            source "./artifacts-spring/spring_image_uri.txt"
            echo "SPRING_IMAGE_URI=$SPRING_IMAGE_URI" >> $GITHUB_ENV
          else
            echo "SPRING_IMAGE_URI=$ECR_REGISTRY/$SPRING_IMAGE_NAME:latest" >> $GITHUB_ENV
          fi
          echo "Spring Image URI: $SPRING_IMAGE_URI"

      # appspec.yml 생성
      - name: Create appspec.yml for EC2
        run: |
          cat > appspec.yml << EOF
          version: 0.0
          os: linux
          files:
            - source: /scripts
              destination: /home/ubuntu/app/scripts
          hooks:
            BeforeInstall:
              - location: scripts/before_install.sh
                timeout: 300
                runas: ubuntu
            AfterInstall:
              - location: scripts/after_install.sh
                timeout: 300
                runas: ubuntu
            ApplicationStart:
              - location: scripts/start_application.sh
                timeout: 600
                runas: ubuntu
          EOF

      # 배포 스크립트 생성
      - name: Create deployment scripts for EC2
        run: |
          mkdir -p scripts
          cat > scripts/before_install.sh << 'EOF'
          #!/bin/bash
          set -e
          echo "Before Install script started"
          if ! command -v jq &> /dev/null; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi
          echo "Before Install script finished"
          exit 0
          EOF

          cat > scripts/after_install.sh << 'EOF'
          #!/bin/bash
          set -e
          echo "After Install script started"
          
          # 권한 설정
          sudo chown -R ubuntu:ubuntu /home/ubuntu/app
          sudo chmod 755 /home/ubuntu/app/scripts/*.sh
          
          rm -rf /tmp/*
          echo "After Install script finished"
          exit 0
          EOF

          cat > scripts/start_application.sh << 'EOF'
          #!/bin/bash
          set -e
          echo "Start Application script started"
          if [[ "${{ env.DEPLOY_SPRING_APP }}" == "true" ]]; then
            echo "Pulling Spring application image: $SPRING_IMAGE_URI"
            docker pull "$SPRING_IMAGE_URI"
            docker stop spring-app-container || true
            docker rm spring-app-container || true
            docker run -d --name spring-app-container -p 8080:8080 "$SPRING_IMAGE_URI"
          else
            echo "Skipping Spring application deployment."
          fi
          echo "Start Application script finished"
          exit 0
          EOF

      - name: Deploy to EC2 with CodeDeploy
        uses: aws-actions/aws-cli@v2
        with:
        args: aws deploy create-deployment \
            --application-name "${{ env.CODE_DEPLOY_APPLICATION_NAME }}" \
            --deployment-group-name "${{ env.CODE_DEPLOY_DEPLOYMENT_GROUP_NAME }}" \
            --deployment-config-name CodeDeployDefault.OneAtATime \
            --revision "{\"revisionType\":\"S3\",\"s3Location\":{\"bucket\":\"${{ env.S3_BUCKET }}\",\"key\":\"appspec.yml\",\"bundleType\":\"zip\"}}"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ env.AWS_REGION }}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8"/>
    <link rel="icon" href="https://static.toss.im/icons/png/4x/icon-toss-logo.png"/>
    <link rel="stylesheet" type="text/css" href="../static/toss_style.css"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>토스페이먼츠 샘플 프로젝트</title>
    <!-- 토스페이먼츠 SDK 추가 -->
    <script src="https://js.tosspayments.com/v2/standard"></script>
</head>

<body>
<!-- 주문서 영역 -->
<div class="wrapper">
    <div class="box_section" style="padding: 40px 30px 50px 30px; margin-top: 30px; margin-bottom: 50px">
        <!-- 결제 UI -->
        <div id="payment-method"></div>
        <!-- 이용약관 UI -->
        <div id="agreement"></div>
        <!-- 쿠폰 체크박스 -->
        <div style="padding-left: 25px">
            <div class="checkable typography--p">
                <label for="coupon-box" class="checkable__label typography--regular"
                ><input id="coupon-box" class="checkable__input" type="checkbox" aria-checked="true"/><span
                        class="checkable__label-text">5,000원 쿠폰 적용</span></label
                >
            </div>
        </div>
        <!-- 결제하기 버튼 -->
        <div class="result wrapper">
            <button class="button" id="payment-button" style="margin-top: 30px">
                결제하기
            </button>
        </div>
    </div>
    <script>
        main();

        async function main() {

            const data = {
                baseUrl: /*$[[{baseUrl}]]*/ "",
                orderId: /*[[${orderId}]]*/ "",
                customerKey: /*[[${customerKey}]]*/ "",
                amount: /*[[${amount}]]*/ 0,
                orderName: /*[[${orderName}]]*/ "",
                method: /*[[${method}]]*/ "가상계좌",
                customerEmail: /*[[${customerEmail}]]*/ "",
                customerName: /*[[${customerName}]]*/ "",
                customerMobilePhone: /*[[${customerMobilePhone}]]*/ ""
            };

            const button = document.getElementById("payment-button");
            const coupon = document.getElementById("coupon-box");
            const amount = {
                currency: "KRW",
                value: data.amount,
            };

            // ------  결제위젯 초기화 ------ https://docs.tosspayments.com/sdk/v2/js
            const clientKey = "test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm";
            const customerKey = data.customerKey;
            const tossPayments = TossPayments(clientKey);
            const widgets = tossPayments.widgets({
                customerKey,
            });

            // ------  주문서의 결제 금액 설정 ------
            await widgets.setAmount(amount);

            // ------  결제 UI 렌더링 ------
            await widgets.renderPaymentMethods({
                selector: "#payment-method",
                variantKey: "DEFAULT",
            });

            // ------  이용약관 UI 렌더링 ------ https://docs.tosspayments.com/reference/widget-sdk#renderagreement
            await widgets.renderAgreement({selector: "#agreement", variantKey: "AGREEMENT"});


            // @docs https://docs.tosspayments.com/sdk/v2/js#widgetssetamount
            coupon.addEventListener("change", async function () {
                if (coupon.checked) {
                    await widgets.setAmount({
                        currency: "KRW",
                        value: amount - 5000,
                    });
                    return;
                }

                await widgets.setAmount({
                    currency: "KRW",
                    value: amount,
                });
            });

            // ------ '결제하기' 버튼 누르면 결제창 띄우기 ------ https://docs.tosspayments.com/sdk/v2/js#widgetsrequestpayment
            button.addEventListener("click", async function () {
                await widgets.requestPayment(data.method, {
                    orderId: data.orderId,
                    orderName: data.orderName,
                    amount: data.amount,
                    successUrl: data.baseUrl + "/virtual/success",
                    failUrl: data.baseUrl + "/virtual/fail",
                    customerEmail: data.customerEmail,
                    customerName: data.customerName,
                    customerMobilePhone: data.customerMobilePhone,
                });
            });
        }

    </script>
</div>
</body>
</html>
